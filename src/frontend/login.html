<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Transify — Login & Registration</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
  <meta name="theme-color" content="#8338ec">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      --primary-hover: linear-gradient(135deg, #6d28d9 0%, #7e22ce 100%);
      --primary-purple: #7c3aed;
      --primary-glow: rgba(124, 58, 237, 0.32);
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-subtle: rgba(131, 56, 236, 0.12);
      --text-dark: #1e1b4b;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #e2e8f0;
      --input-focus: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background-color: #f8f4fb;
      background-image: 
        radial-gradient(circle at 10% 12%, rgba(254, 110, 161, 0.35) 0%, transparent 42%),
        radial-gradient(circle at 50% 8%, rgba(254, 214, 80, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 8% 90%, rgba(190, 110, 241, 0.38) 0%, transparent 48%),
        radial-gradient(circle at 92% 92%, rgba(254, 200, 74, 0.35) 0%, transparent 42%),
        radial-gradient(circle at 50% 50%, #fdf8fc 0%, #f7f2fa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Decorative Organic Ambient Shapes */
    .ambient-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(54px);
      pointer-events: none;
      z-index: 1;
    }
    .shape-pink {
      top: -60px;
      left: -60px;
      width: 320px;
      height: 320px;
      background: rgba(254, 110, 161, 0.45);
    }
    .shape-yellow-top {
      top: -50px;
      left: 35%;
      width: 280px;
      height: 240px;
      background: rgba(254, 214, 80, 0.4);
    }
    .shape-purple {
      bottom: -70px;
      left: -50px;
      width: 340px;
      height: 340px;
      background: rgba(190, 110, 241, 0.45);
    }
    .shape-yellow-bottom {
      bottom: -60px;
      right: -40px;
      width: 320px;
      height: 300px;
      background: rgba(254, 200, 74, 0.38);
    }

    /* Main Container (Unified Centered Device Frame with Exact Reference Mockup) */
    .auth-container {
      width: min(440px, 94vw);
      height: auto;
      aspect-ratio: 613 / 1024;
      max-height: min(840px, 94vh);
      position: relative;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(131, 56, 236, 0.22), 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.90);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      isolation: isolate;
      z-index: 10;
      margin: auto;
    }

    /* Outside Brand Header ("ei transify lekha ta bahie likhte hobbe") */
    .auth-brand-outside {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      margin-bottom: 14px;
      position: relative;
      z-index: 3;
      text-align: center;
      pointer-events: auto;
    }

    .auth-brand-outside-img {
      width: min(250px, 72%);
      height: auto;
      max-height: 72px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(124, 58, 237, 0.16));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-brand-outside-img:hover {
      transform: scale(1.025);
    }

    /* Background Artwork Layer */
    .auth-illustration-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background-color: #f7f2fa;
    }
    .auth-illustration-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .auth-illustration-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg, 
        rgba(255, 255, 255, 0.04) 0%, 
        rgba(248, 244, 251, 0.25) 28%, 
        rgba(248, 244, 251, 0.76) 55%, 
        rgba(248, 244, 251, 0.96) 100%
      );
    }

    /* The Box Starts Here ("tar por box ta suru korte hob") */
    .auth-card-wrap {
      width: 100%;
      position: relative;
      z-index: 2;
      margin-bottom: auto;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: 
        0 24px 60px rgba(131, 56, 236, 0.14),
        0 4px 16px rgba(0, 0, 0, 0.03),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.95);
      padding: 32px 34px 28px 34px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    /* Top Dual Pill Tab Toggle */
    .auth-tab-bar {
      display: flex;
      background: #f3f0fa;
      border-radius: 9999px;
      padding: 4px;
      margin-bottom: 22px;
      position: relative;
      border: 1px solid rgba(131, 56, 236, 0.08);
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 18px;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 14.5px;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tab-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }
    .tab-btn:hover:not(.active) {
      color: var(--primary-purple);
      background: rgba(255, 255, 255, 0.5);
    }

    .tab-btn.active {
      background: var(--primary-gradient);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .tab-btn.active svg {
      stroke: #ffffff;
    }

    /* Card Header */
    .card-heading {
      text-align: center;
      margin-bottom: 22px;
    }
    .card-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.02em;
      margin-bottom: 5px;
    }
    .card-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Form Fields */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #8b5cf6;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .auth-input {
      width: 100%;
      height: 48px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      padding: 0 44px 0 44px;
      font-size: 14.5px;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
    .auth-input:focus {
      border-color: var(--input-focus);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.14);
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.18s ease;
    }
    .password-toggle-btn:hover {
      color: var(--primary-purple);
    }

    /* Options Row: Remember Me & Forgot Password */
    .form-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 0 6px 0;
      font-size: 13.5px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #475569;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-purple);
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary-purple);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.18s ease;
    }
    .forgot-link:hover {
      color: #6d28d9;
      text-decoration: underline;
    }

    /* Primary CTA Button */
    .auth-primary-btn {
      width: 100%;
      height: 50px;
      border-radius: 9999px;
      background: var(--primary-gradient);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 22px var(--primary-glow);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 4px;
    }
    .auth-primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.44);
    }
    .auth-primary-btn:active {
      transform: translateY(0);
    }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
    .auth-divider span {
      padding: 0 14px;
    }

    /* Social Google Button */
    .google-btn {
      width: 100%;
      height: 48px;
      border-radius: 9999px;
      background: #ffffff;
      border: 1.5px solid var(--input-border);
      color: #1e293b;
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .google-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    /* Quick Demo Helper Chip */
    .quick-demo-row {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }
    .quick-demo-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(131, 56, 236, 0.07);
      border: 1px dashed rgba(131, 56, 236, 0.28);
      border-radius: 9999px;
      font-size: 12px;
      color: var(--primary-purple);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .quick-demo-pill:hover {
      background: rgba(131, 56, 236, 0.14);
      transform: scale(1.02);
    }

    /* Feedback Alert Banner */
    .auth-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    .auth-alert.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      color: #15803d;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .auth-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: #b91c1c;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* --------------------------------------------------------------------------
       VIEW 1: Welcome Screen (Exact Match to User Uploaded Mockup)
       -------------------------------------------------------------------------- */
    .auth-welcome-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      box-sizing: border-box;
      z-index: 2;
      overflow: hidden;
      background: #ffffff;
    }

    .auth-welcome-exact-card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .auth-welcome-exact-artwork {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .auth-hotspots-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    .auth-exact-hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 9999px;
      outline: none;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, background 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* 1. Register Button: y=69.5%, height=6.4%, x=11.6%, width=76.7% */
    .auth-hotspot-register {
      top: 69.5%;
      left: 11.6%;
      width: 76.7%;
      height: 6.4%;
      border-radius: 9999px;
    }

    .auth-hotspot-register:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.45);
      background: rgba(255, 255, 255, 0.12);
    }

    .auth-hotspot-register:active {
      transform: scale(0.98);
    }

    /* 2. Login Button: y=77.9%, height=6.1%, x=11.6%, width=76.7% */
    .auth-hotspot-login {
      top: 77.9%;
      left: 11.6%;
      width: 76.7%;
      height: 6.1%;
      border-radius: 9999px;
    }

    .auth-hotspot-login:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.22);
      background: rgba(124, 58, 237, 0.06);
    }

    .auth-hotspot-login:active {
      transform: scale(0.98);
    }

    /* 3. Continue without registration link: y=86.9%, height=3.5%, x=17.9%, width=64.1% */
    .auth-hotspot-guest {
      top: 86.9%;
      left: 17.9%;
      width: 64.1%;
      height: 3.5%;
      border-radius: 9999px;
    }

    .auth-hotspot-guest:hover {
      transform: translateY(-1px);
      background: rgba(124, 58, 237, 0.08);
    }

    .auth-hotspot-guest:active {
      transform: scale(0.98);
    }

    .auth-exact-hotspot:focus-visible {
      box-shadow: 0 0 0 3px #8338ec, 0 0 0 6px rgba(131, 56, 236, 0.3) !important;
    }

    /* --------------------------------------------------------------------------
       VIEW 2: Slide-up Bottom Sheet ("nich theke slide kortese")
       -------------------------------------------------------------------------- */
    .auth-sheet-container {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      pointer-events: none;
      overflow: hidden;
      border-radius: 36px;
    }

    .auth-sheet-container.active {
      pointer-events: auto;
    }

    .auth-sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(20, 15, 35, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .auth-sheet-container.active .auth-sheet-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .auth-sheet-card {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 94%;
      max-height: 94%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-radius: 32px 32px 0 0;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-bottom: none;
      box-shadow: 0 -16px 54px rgba(124, 58, 237, 0.22);
      padding: 18px 22px 20px 22px;
      box-sizing: border-box;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.52s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
    }

    .auth-sheet-container.active .auth-sheet-card {
      transform: translateY(0);
      opacity: 1;
    }

    .auth-sheet-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      width: 100%;
    }

    .auth-sheet-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.16);
      color: #7c3aed;
      font-size: 13.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-sheet-back-btn:hover {
      background: rgba(124, 58, 237, 0.16);
      transform: translateX(-2px);
    }

    .auth-sheet-back-btn:active {
      transform: scale(0.95);
    }

    .auth-switch-prompt {
      text-align: center;
      font-size: 13.5px;
      color: #64748b;
      margin-top: 14px;
    }

    .auth-switch-prompt a {
      color: #7c3aed;
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      transition: color 0.18s ease;
    }

    .auth-switch-prompt a:hover {
      color: #6d28d9;
      text-decoration: underline;
    }

    /* Responsive Adaptation for Mobile & Tablet */
    @media (max-width: 860px) {
      body {
        padding: 16px 12px;
      }
      .auth-container {
        grid-template-columns: 1fr;
        gap: 20px;
        min-height: auto;
      }
      .auth-hero-col {
        padding: 10px 0;
      }
      .hero-artwork-wrap {
        max-width: 380px;
      }
      .auth-card {
        padding: 26px 22px 22px 22px;
        border-radius: 26px;
      }
      .card-title {
        font-size: 23px;
      }
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 22px 18px 20px 18px;
        border-radius: 22px;
      }
      .card-title {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Background Shapes -->
  <div class="ambient-shape shape-pink"></div>
  <div class="ambient-shape shape-yellow-top"></div>
  <div class="ambient-shape shape-purple"></div>
  <div class="ambient-shape shape-yellow-bottom"></div>

  <!-- Unified Main Container (Illustration Background with Slide-Up Sheet) -->
  <main class="auth-container transify-auth-screen" id="transify-auth-page" role="main" aria-label="Transify Authentication Gateway">

    <!-- Background Ambient Waves Layer -->
    <div class="auth-illustration-bg">
      <img 
        src="/static/slide-bg-waves.jpg?v=20261116_sheet_v14" 
        alt="Transify Background" 
        class="auth-illustration-img"
      >
      <div class="auth-illustration-overlay"></div>
    </div>

    <!-- =========================================================
         VIEW 1: Welcome Screen (Exact Match to User Reference Mockup)
         ========================================================= -->
    <div class="auth-welcome-view" id="auth-welcome-view">
      <div class="auth-welcome-exact-card">
        <img 
          src="/static/login-welcome-exact.jpg?v=20261118_exact_v2" 
          alt="Transify — Breaking Communication Barriers" 
          class="auth-welcome-exact-artwork"
          onerror="this.onerror=null; this.src='/static/login-hero-exact.png';"
        >
        <div class="auth-hotspots-layer">
          <button 
            type="button" 
            class="auth-exact-hotspot auth-hotspot-register" 
            id="btn-open-register" 
            onclick="openAuthSheet('signup')" 
            aria-label="Register - Create a new account"
            title="Register - Create a new account"
          ></button>

          <button 
            type="button" 
            class="auth-exact-hotspot auth-hotspot-login" 
            id="btn-open-login" 
            onclick="openAuthSheet('login')" 
            aria-label="Login - Sign in to your account"
            title="Login - Sign in to your account"
          ></button>

          <button 
            type="button" 
            class="auth-exact-hotspot auth-hotspot-guest" 
            id="btn-demo-guest" 
            onclick="handleDemoGuest()" 
            aria-label="Continue without registration as Guest"
            title="Continue without registration as Guest"
          ></button>
        </div>
      </div>
    </div>

    <!-- =========================================================
         VIEW 2: Slide-up Bottom Sheet ("nich theke slide kortese")
         ========================================================= -->
    <div class="auth-sheet-container" id="auth-sheet-container">
      <!-- Dimmed backdrop (clicking it closes the sheet) -->
      <div class="auth-sheet-backdrop" id="auth-sheet-backdrop" onclick="closeAuthSheet()"></div>

      <!-- Slide-up Frosted Card -->
      <div class="auth-sheet-card" id="auth-sheet-card">
        <!-- Sheet Top Navigation: Back Button & Mode Indicator -->
        <div class="auth-sheet-top-bar">
          <button type="button" class="auth-sheet-back-btn" id="auth-back-btn" onclick="closeAuthSheet()" aria-label="Back to welcome screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back</span>
          </button>

          <!-- Dual Pill Tab Switcher: Login / Sign Up -->
          <div class="auth-tab-bar" role="tablist" aria-label="Authentication mode selection" style="margin-bottom: 0;">
            <button type="button" class="tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="auth-form" onclick="setMode('login')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <span>Login</span>
            </button>
            <button type="button" class="tab-btn" id="tab-signup" role="tab" aria-selected="false" aria-controls="auth-form" onclick="setMode('signup')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                <line x1="19" x2="19" y1="8" x2="14"/><line x1="22" x2="16" y1="11" y2="11"/>
              </svg>
              <span>Sign Up</span>
            </button>
          </div>
        </div>

        <!-- Dynamic Header -->
        <header class="card-heading" style="margin-bottom: 16px;">
          <h1 class="card-title" id="auth-heading-title" style="font-size: 24px;">Welcome Back!</h1>
          <p class="card-subtitle" id="auth-heading-subtitle">Login to your Transify account</p>
        </header>

        <!-- Feedback Alert Container -->
        <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite"></div>

        <!-- Interactive Form -->
        <form class="auth-form" id="auth-form" onsubmit="handleAuthSubmit(event)">

          <!-- Full Name Field (Displayed conditionally in Sign Up mode) -->
          <div class="input-group" id="group-fullname" style="display: none;">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <input 
              type="text" 
              class="auth-input" 
              id="input-fullname" 
              placeholder="Full Name" 
              value="Sarah Ahmed"
              autocomplete="name"
            >
          </div>

          <!-- Email Field -->
          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </div>
            <input 
              type="email" 
              class="auth-input" 
              id="input-email" 
              placeholder="Email" 
              value="demo@transify.ai" 
              required
              autocomplete="email"
            >
          </div>

          <!-- Password Field with Interactive Eye Toggle -->
          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <input 
              type="password" 
              class="auth-input" 
              id="input-password" 
              placeholder="Password" 
              value="transify2026" 
              required
              autocomplete="current-password"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              id="toggle-pwd-btn" 
              aria-label="Toggle password visibility"
              onclick="togglePasswordVisibility()"
            >
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <!-- Utility Options Row: Remember Me & Forgot Password -->
          <div class="form-options-row" id="auth-options-row">
            <label class="checkbox-label" for="input-remember">
              <input type="checkbox" id="input-remember" checked>
              <span id="remember-label-text">Remember me</span>
            </label>
            <a href="#" class="forgot-link" id="forgot-password-link" onclick="handleForgotPassword(event)">Forgot password?</a>
          </div>

          <!-- Primary Submit Button -->
          <button type="submit" class="auth-primary-btn" id="auth-submit-btn">
            <span id="btn-text">Login</span>
            <span class="btn-arrow" style="font-size: 1.1rem; line-height: 1;">→</span>
          </button>

          <!-- Divider -->
          <div class="auth-divider">
            <span>or</span>
          </div>

          <!-- Continue with Google Social Button -->
          <button type="button" class="google-btn" id="google-login-btn" onclick="handleGoogleLogin()">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <!-- Bottom Prompt to Switch Mode inside Sheet -->
          <p class="auth-switch-prompt" id="auth-switch-prompt" style="text-align: center; font-size: 13.5px; color: #64748b; margin-top: 14px;">
            <span id="switch-prompt-text">Don't have an account?</span>
            <a href="#" id="switch-prompt-link" onclick="setMode(activeMode === 'login' ? 'signup' : 'login'); return false;" style="color: #7c3aed; font-weight: 700; text-decoration: none; margin-left: 4px;">Sign Up</a>
          </p>

        </form>

      </div>
    </div>

  </main>

  <script>
    let activeMode = 'login'; // 'login' or 'signup'

    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const headingTitle = document.getElementById('auth-heading-title');
    const headingSubtitle = document.getElementById('auth-heading-subtitle');
    const groupFullname = document.getElementById('group-fullname');
    const inputFullname = document.getElementById('input-fullname');
    const btnText = document.getElementById('btn-text');
    const rememberLabelText = document.getElementById('remember-label-text');
    const forgotLink = document.getElementById('forgot-password-link');
    const alertBox = document.getElementById('auth-alert');
    const sheetContainer = document.getElementById('auth-sheet-container');
    const switchPromptText = document.getElementById('switch-prompt-text');
    const switchPromptLink = document.getElementById('switch-prompt-link');

    function openAuthSheet(mode) {
      setMode(mode || 'login');
      if (sheetContainer) sheetContainer.classList.add('active');
    }

    function closeAuthSheet() {
      if (sheetContainer) sheetContainer.classList.remove('active');
      hideAlert();
    }

    // Close on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAuthSheet();
    });

    function setMode(mode) {
      activeMode = mode;
      hideAlert();
      if (mode === 'login') {
        if (tabLogin) { tabLogin.classList.add('active'); tabLogin.setAttribute('aria-selected', 'true'); }
        if (tabSignup) { tabSignup.classList.remove('active'); tabSignup.setAttribute('aria-selected', 'false'); }

        if (headingTitle) headingTitle.textContent = 'Welcome Back!';
        if (headingSubtitle) headingSubtitle.textContent = 'Login to your Transify account';
        if (groupFullname) groupFullname.style.display = 'none';
        if (inputFullname) inputFullname.removeAttribute('required');
        if (btnText) btnText.textContent = 'Login';
        if (rememberLabelText) rememberLabelText.textContent = 'Remember me';
        if (forgotLink) forgotLink.style.display = 'inline';
        if (switchPromptText) switchPromptText.textContent = "Don't have an account?";
        if (switchPromptLink) switchPromptLink.textContent = "Sign Up";
      } else {
        if (tabSignup) { tabSignup.classList.add('active'); tabSignup.setAttribute('aria-selected', 'true'); }
        if (tabLogin) { tabLogin.classList.remove('active'); tabLogin.setAttribute('aria-selected', 'false'); }

        if (headingTitle) headingTitle.textContent = 'Join Transify!';
        if (headingSubtitle) headingSubtitle.textContent = 'Create your account to start communicating';
        if (groupFullname) groupFullname.style.display = 'flex';
        if (inputFullname) inputFullname.removeAttribute('required');
        if (btnText) btnText.textContent = 'Register & Open Slides';
        if (rememberLabelText) rememberLabelText.textContent = 'I agree to Terms & Privacy';
        if (forgotLink) forgotLink.style.display = 'none';
        if (switchPromptText) switchPromptText.textContent = "Already have an account?";
        if (switchPromptLink) switchPromptLink.textContent = "Login";
      }
    }

    function handleDirectLogin() {
      showAlert('Logging in as Sarah Ahmed...', true);
      completeAuthentication({
        name: 'Sarah Ahmed',
        email: 'demo@transify.ai',
        provider: 'direct'
      });
    }

    function handleDemoGuest() {
      showAlert('Continuing as Demo Guest...', true);
      completeAuthentication({
        name: 'Sarah Ahmed',
        email: 'demo@transify.ai',
        provider: 'guest'
      });
    }

    // Password Visibility Toggle
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('input-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
          <line x1="2" x2="22" y1="2" y2="22"/>
        `;
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }

    // Feedback Alerts
    function showAlert(msg, isSuccess = true) {
      alertBox.textContent = msg;
      alertBox.className = `auth-alert ${isSuccess ? 'success' : 'error'}`;
    }
    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    // Handle Forgot Password
    function handleForgotPassword(e) {
      e.preventDefault();
      showAlert('Password reset link has been dispatched to your email.', true);
    }

    // Handle Form Submit
    function handleAuthSubmit(e) {
      if (e) e.preventDefault();
      const emailInput = document.getElementById('input-email');
      const pwdInput = document.getElementById('input-password');
      const email = emailInput ? emailInput.value.trim() : '';
      const password = pwdInput ? pwdInput.value : '';
      const fullname = inputFullname && inputFullname.value.trim() ? inputFullname.value.trim() : 'Sarah Ahmed';

      if (!email || !password) {
        showAlert('Please fill in both email and password.', false);
        const submitBtn = document.getElementById('auth-submit-btn');
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
        }
        return;
      }

      const submitBtn = document.getElementById('auth-submit-btn');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.75';
        const label = submitBtn.querySelector('#btn-text');
        if (label) label.textContent = activeMode === 'login' ? 'Authenticating...' : 'Registering...';
      }

      setTimeout(() => {
        try {
          showAlert(activeMode === 'login' ? 'Login successful! Redirecting...' : 'Account created! Redirecting...', true);
          completeAuthentication({
            name: fullname,
            email: email,
            provider: 'password'
          });
        } catch (err) {
          showAlert('Authentication failed. Please try again.', false);
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            const label = submitBtn.querySelector('#btn-text');
            if (label) label.textContent = activeMode === 'login' ? 'Login' : 'Register & Open Slides';
          }
        }
      }, 400);
    }

    // Handle Google Login
    function handleGoogleLogin() {
      showAlert('Connecting with Google Account...', true);
      setTimeout(() => {
        completeAuthentication({
          name: 'Sarah Ahmed',
          email: 'sarah.ahmed@gmail.com',
          provider: 'google'
        });
      }, 600);
    }

    // Complete Authentication & Launch Application with Splash Loading
    function completeAuthentication(userObj) {
      try {
        localStorage.setItem('transify_auth_user', JSON.stringify(userObj));
        localStorage.setItem('transify_auth_token', 'demo_jwt_token_' + Date.now());
      } catch (err) {
        console.warn('LocalStorage error:', err);
      }

      // Smooth transition to the app
      setTimeout(() => {
        window.location.href = '/?auth_completed=1';
      }, 150);
    }
  </script>
</body>
</html>
