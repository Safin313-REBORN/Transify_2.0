<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Transify 2.0</title>
  <meta name="description" content="The requested page could not be found on Transify 2.0.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/shell.css?v=20261125_pro_ui_v14">
  <link rel="stylesheet" href="/static/styles.css?v=20261125_pro_ui_v14">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #1f1836 0%, #100d1a 100%);
      color: #FFFFFF;
      font-family: var(--font-sans, system-ui, sans-serif);
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .error-card {
      max-width: 560px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.18);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
      margin-bottom: 20px;
    }
    .error-code {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      margin: 0 0 12px;
      background: linear-gradient(135deg, #FFCB05 0%, #8338EC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 12px;
      color: #FFFFFF;
    }
    .error-desc {
      font-size: 15px;
      line-height: 1.6;
      color: #B4B0C7;
      margin: 0 0 28px;
    }
    .action-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .btn-404-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 20px;
      background: #8338EC;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn-404-primary:hover {
      background: #9D4EDD;
      transform: translateY(-1.5px);
    }
    .btn-404-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 13.5px;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn-404-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1.5px);
    }
    .error-footer {
      margin-top: 24px;
      font-size: 12.5px;
      color: #7E7A94;
    }
  </style>
</head>
<body>
  <main class="error-card" role="main">
    <div class="error-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span>Resource Not Found</span>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The requested modality, tool, or endpoint does not exist or has been relocated to another route in Transify 2.0.</p>
    
    <nav class="action-links" aria-label="Recovery navigation">
      <a href="/" class="btn-404-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Return to Home
      </a>
      <a href="/sign" class="btn-404-secondary">Sign Translator</a>
      <a href="/braille" class="btn-404-secondary">Braille Scanner</a>
      <a href="/voice" class="btn-404-secondary">Voice Hub</a>
      <a href="/care" class="btn-404-secondary">Transify Care</a>
    </nav>

    <footer class="error-footer">
      © 2026 <strong>Team Alpha Nexus</strong> • Engineered for Healthcare &amp; Accessibility Equity
    </footer>
  </main>
</body>
</html>
