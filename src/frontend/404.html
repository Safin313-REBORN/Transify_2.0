<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transify — Page Not Found (404)</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/styles.css?v=20261118_authfix_v9">
  <style>
    body {
      background-color: #f5f3ff;
      background-image: radial-gradient(circle at 50% 30%, #ede9fe 0%, #f5f3ff 70%);
      color: #1e1b4b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .error-card {
      background: #ffffff;
      max-width: 540px;
      width: 100%;
      border-radius: 24px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(131, 56, 236, 0.14);
    }
    .error-code {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 12px;
    }
    .error-title {
      font-size: 22px;
      font-weight: 800;
      color: #1e1b4b;
      margin: 0 0 12px;
    }
    .error-desc {
      font-size: 15px;
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 480px) {
      .actions-grid { grid-template-columns: 1fr; }
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary-action {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }
    .btn-primary-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }
    .btn-secondary-action {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }
    .btn-secondary-action:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <main class="error-card" role="main" aria-labelledby="error-heading">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 class="error-title" id="error-heading">Communication Channel Not Found</h1>
    <p class="error-desc">
      The assistive view or resource you are looking for does not exist or has been relocated. Choose a verified destination below to continue.
    </p>
    <div class="actions-grid">
      <a href="/" class="btn-action btn-primary-action">
        🏠 Return Home
      </a>
      <a href="/sign" class="btn-action btn-secondary-action">
        ✋ Live Sign Translator
      </a>
      <a href="/braille" class="btn-action btn-secondary-action">
        ⠃⠗ Optical Braille
      </a>
      <a href="/login" class="btn-action btn-secondary-action">
        🔐 Account Login
      </a>
    </div>
  </main>
</body>
</html>
