<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111F"/>
      <stop offset="100%" stop-color="#1F1A3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8338EC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8338EC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="288" height="32" rx="16" fill="#8338EC" fill-opacity="0.15" stroke="#8338EC" stroke-width="1.5"/>
    <text x="12" y="21" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#8338EC" letter-spacing="1">HUMAN CLINICAL OVERSIGHT</text>
    
    <text x="0" y="80" font-family="'Schibsted Grotesk', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Clinician Oversight & Review</text>
    <text x="0" y="125" font-family="'Hind Siliguri', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#B9BAD0">Human-in-the-Loop Clinical Verification & Oversight</text>
    
    <line x1="0" y1="160" x2="120" y2="160" stroke="#8338EC" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>