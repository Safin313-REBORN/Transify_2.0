<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transify — Assistive Control Dashboard</title>
  <meta name="description" content="View historical translation logs, system health diagnostics, and accuracy metrics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/styles.css?v=20261120_redesign_v2">
  <link rel="canonical" href="https://transify.app/dashboard">
</head>
<body style="background:var(--paper); color:var(--ink); min-height:100vh; display:flex; flex-direction:column;">

  <!-- Accessible Skip Link -->
  <a href="#dashboard-main-container" class="skip-link">Skip to dashboard</a>

  <!-- Polite Live Region -->
  <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Top Navigation Header -->
  <header class="slide-header" style="position:static; background:var(--ink); color:#fff;">
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <a href="/" class="btn btn-outline-ink" style="min-height:36px; padding:0.25rem 0.75rem; font-size:var(--text-xs); text-decoration:none;" aria-label="Back to Home">← Home</a>
      <h1 class="slide-header-title" style="font-size:var(--text-base); color:#fff;">Assistive Control Dashboard</h1>
    </div>
  </header>

    <!-- Accessible Breadcrumbs -->
  <nav aria-label="Breadcrumb" class="transify-breadcrumbs" style="padding: 8px 16px; font-size: 13px;">
    <ol itemscope itemtype="https://schema.org/BreadcrumbList" style="display:flex; list-style:none; gap:8px; margin:0; padding:0;">
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a itemprop="item" href="/" style="color:var(--violet); text-decoration:none;"><span itemprop="name">Home</span></a>
        <meta itemprop="position" content="1" />
      </li>
      <li aria-hidden="true" style="color:var(--line);">/</li>
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem" aria-current="page">
        <span itemprop="name">Dashboard</span>
        <meta itemprop="position" content="2" />
      </li>
    </ol>
  </nav>
  <main id="dashboard-main-container" style="flex:1; max-width:840px; margin:0 auto; width:100%; padding:1.5rem 1.25rem 6.5rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <div>
        <h2 style="font-size:var(--text-xl); font-weight:800;">Recent Translation Logs</h2>
        <p style="font-size:var(--text-sm); color:var(--text-2);">Local offline privacy-first history</p>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button type="button" id="clear-history-btn" class="btn btn-outline-ink" style="color:var(--danger); border-color:var(--line); font-size:var(--text-xs); min-height:36px; padding:0.25rem 0.75rem;">Clear History</button>
      </div>
    </div>

    <!-- History Records List Container -->
    <div id="history-records-list" style="display:flex; flex-direction:column; gap:0.75rem;">
      <div style="background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-card); padding:2rem; text-align:center; color:var(--text-2);">
        Loading historical records...
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="transify-bottom-nav" aria-label="Main Navigation">
    <a href="/" class="bottom-nav-item" data-nav="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="/sign" class="bottom-nav-item" data-nav="sign">
      <span class="nav-icon">✋</span>
      <span class="nav-label">Sign</span>
    </a>
    <a href="/braille" class="bottom-nav-item" data-nav="braille">
      <span class="nav-icon">⠃</span>
      <span class="nav-label">Braille</span>
    </a>
    <a href="/#voice" class="bottom-nav-item" data-nav="voice">
      <span class="nav-icon">🎙️</span>
      <span class="nav-label">Voice</span>
    </a>
  </nav>

  <!-- Client Application Script -->
  <script src="/static/app.js?v=20261120_redesign_v2"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.TransifyDashboard && typeof window.TransifyDashboard.init === 'function') {
        window.TransifyDashboard.init();
      }
    });
  </script>
</body>
</html>
