<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Assistive Control Dashboard — Transify</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body {
      background: var(--paper, #EEEFF5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--font-body, "Hind Siliguri", sans-serif);
      margin: 0;
    }
    .redirect-card {
      text-align: center;
      padding: 32px;
      background: var(--surface, #FFF);
      border-radius: var(--radius-card, 16px);
      box-shadow: var(--shadow-card);
      border: var(--border-width, 1.5px) solid var(--line, #D9DAE6);
    }
  </style>
</head>
<body>
  <div class="redirect-card card-uiverse" id="dashboard-container">
    <div class="go-corner" aria-hidden="true"><span class="go-arrow">→</span></div>
    <div class="kinetic-loader-wrap" style="margin: 16px auto 28px; height: 140px; display: flex; align-items: center; justify-content: center;">
      <div class="main">
        <div class="loaders">
          <div class="loader"></div>
          <div class="loader"></div>
          <div class="loader"></div>
          <div class="loader"></div>
          <div class="loader"></div>
          <div class="loader"></div>
          <div class="loader"></div>
          <div class="loader"></div>
          <div class="loader"></div>
        </div>
        <div class="loadersB">
          <div class="loaderA"><div class="ball0"></div></div>
          <div class="loaderA"><div class="ball1"></div></div>
          <div class="loaderA"><div class="ball2"></div></div>
          <div class="loaderA"><div class="ball3"></div></div>
          <div class="loaderA"><div class="ball4"></div></div>
          <div class="loaderA"><div class="ball5"></div></div>
          <div class="loaderA"><div class="ball6"></div></div>
          <div class="loaderA"><div class="ball7"></div></div>
          <div class="loaderA"><div class="ball8"></div></div>
          <div class="loaderA"><div class="ball9"></div></div>
        </div>
      </div>
    </div>
    <h1 style="font-family: var(--font-display, 'Schibsted Grotesk', sans-serif); font-size: 24px; font-weight: 800; margin-bottom: 8px;">Assistive Control Dashboard</h1>
    <p style="color: var(--text-2, #4A4860); margin-bottom: 16px;">Redirecting to Transify Assistive Hub...</p>
    <ul id="history-records-list" style="display: none;"></ul>
    <noscript>
      <p><a href="/" style="color: var(--violet, #8338EC); font-weight: 700;">Go to Transify Dashboard</a></p>
    </noscript>
  </div>
  <script>
    window.location.replace('/#dashboard');
  </script>
</body>
</html>
