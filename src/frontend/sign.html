<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transify — Live ASL & HaGRID Hand Gesture Translator</title>
  <meta name="description" content="Translate live Bengali Sign Language (BdSL) and American Sign Language (ASL/HaGRID) gestures into accessible text in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/styles.css?v=20261120_redesign_v2">
  <link rel="canonical" href="https://transify.app/sign">
</head>
<body style="background:var(--ink); color:#fff; min-height:100vh; display:flex; flex-direction:column;">

  <!-- Accessible Skip Link -->
  <a href="#sign-main-container" class="skip-link">Skip to translator</a>

  <!-- Polite Live Region -->
  <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Top Navigation Header -->
  <header class="slide-header" style="position:static;">
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <a href="/" class="btn btn-outline-ink" style="min-height:36px; padding:0.25rem 0.75rem; font-size:var(--text-xs); text-decoration:none;" aria-label="Back to Home">← Home</a>
      <h1 class="slide-header-title" style="font-size:var(--text-base);">Live ASL & HaGRID Hand Gesture Translator</h1>
    </div>

    <!-- Language Mode Switcher (BdSL / ASL) -->
    <div style="display:inline-flex; background:rgba(255,255,255,0.1); border-radius:var(--radius-pill); padding:2px;">
      <button type="button" id="lang-bdsl-btn" class="btn btn-signal" style="min-height:32px; padding:0.2rem 0.6rem; font-size:var(--text-xs);">BdSL</button>
      <button type="button" id="lang-asl-btn" class="btn btn-outline-ink" style="min-height:32px; padding:0.2rem 0.6rem; font-size:var(--text-xs); border:none;">ASL</button>
    </div>
  </header>

    <!-- Accessible Breadcrumbs -->
  <nav aria-label="Breadcrumb" class="transify-breadcrumbs" style="padding: 8px 16px; font-size: 13px;">
    <ol itemscope itemtype="https://schema.org/BreadcrumbList" style="display:flex; list-style:none; gap:8px; margin:0; padding:0;">
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a itemprop="item" href="/" style="color:var(--violet); text-decoration:none;"><span itemprop="name">Home</span></a>
        <meta itemprop="position" content="1" />
      </li>
      <li aria-hidden="true" style="color:var(--line);">/</li>
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem" aria-current="page">
        <span itemprop="name">Sign Translator</span>
        <meta itemprop="position" content="2" />
      </li>
    </ol>
  </nav>
  <main id="sign-main-container" style="flex:1; max-width:760px; margin:0 auto; width:100%; padding:1rem 1.25rem 6.5rem;">
    
    <!-- Camera Viewport Stage -->
    <div class="sign-camera-stage photo-frame">
      <video id="sign-video" class="webcam-video camera-mirror" autoplay playsinline muted></video>
      <canvas id="sign-canvas" class="webcam-canvas camera-mirror"></canvas>

      <!-- Yellow ROI Corner Brackets -->
      <div class="roi-brackets-overlay" aria-hidden="true">
        <span class="roi-corner roi-tl"></span>
        <span class="roi-corner roi-tr"></span>
        <span class="roi-corner roi-bl"></span>
        <span class="roi-corner roi-br"></span>
      </div>

      <!-- Live Dynamic Resolution Badge -->
      <div id="camera-status-badge" class="camera-status-pill">
        <span id="camera-resolution-text">● Ready</span>
      </div>

      <!-- Stage Camera Actions -->
      <div style="position:absolute; bottom:1rem; left:1rem; right:1rem; display:flex; justify-content:space-between; z-index:10;">
        <button type="button" id="toggle-camera-btn" class="btn btn-signal">Start Camera</button>
        <button type="button" id="reset-sign-btn" class="btn btn-outline-ink" style="background:rgba(20,17,31,0.7);">Reset</button>
        <button type="button" id="speak-pred-btn" class="btn btn-outline-ink" style="background:rgba(20,17,31,0.7);">Speak</button>
      </div>
    </div>

    <!-- Results Panel (Paper Surface, 20px Top Radius) -->
    <div class="sign-results-sheet" style="border-radius:var(--radius-card); margin-top:1rem;">
      
      <!-- Segmented Mode Tabs -->
      <div class="mode-segmented-row" role="tablist">
        <button type="button" id="mode-expressions-btn" class="mode-tab-btn active" role="tab" aria-selected="true">Words</button>
        <button type="button" id="mode-fingerspell-btn" class="mode-tab-btn" role="tab" aria-selected="false">Letters (A-Z)</button>
        <button type="button" id="mode-sentence-btn" class="mode-tab-btn" role="tab" aria-selected="false">Sentence</button>
      </div>

      <!-- 3-Segment Consensus Progress Meter -->
      <div class="debounce-progress-container">
        <div class="progress-step-label">Detection Consensus</div>
        <div class="progress-meter-track">
          <div id="debounce-progress-fill" class="progress-meter-fill"></div>
        </div>
      </div>

      <!-- Big Recognized Word Hero & Circular Confidence -->
      <div class="word-prediction-hero">
        <div>
          <span style="font-size:var(--text-xs); color:var(--text-2); font-weight:700; text-transform:uppercase;">Predicted Sign</span>
          <div id="pred-label-text" class="pred-word-text">Ready</div>
        </div>
        <div class="confidence-ring-wrap">
          <svg class="confidence-ring-svg" viewBox="0 0 36 36">
            <path class="confidence-ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path id="confidence-ring-path" class="confidence-ring-val" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <span id="pred-confidence-badge" class="confidence-text-label">--% sure</span>
        </div>
      </div>

      <!-- Sentence Builder Strip -->
      <div class="sentence-strip-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
          <span style="font-size:var(--text-xs); font-weight:700; color:var(--text-2); text-transform:uppercase;">Assembled Sentence</span>
          <div style="display:flex; gap:0.4rem;">
            <button type="button" id="smooth-sentence-btn" class="btn btn-signal" style="min-height:32px; padding:0.2rem 0.6rem; font-size:var(--text-xs);">✨ Smooth</button>
            <button type="button" id="speak-sentence-btn" class="btn btn-outline-ink" style="min-height:32px; padding:0.2rem 0.6rem; font-size:var(--text-xs); color:var(--ink); border-color:var(--line);">Speak</button>
            <button type="button" id="copy-sentence-btn" class="btn btn-outline-ink" style="min-height:32px; padding:0.2rem 0.6rem; font-size:var(--text-xs); color:var(--ink); border-color:var(--line);">Copy</button>
            <button type="button" id="clear-sentence-btn" class="btn btn-outline-ink" style="min-height:32px; padding:0.2rem 0.6rem; font-size:var(--text-xs); color:var(--danger); border-color:var(--line);">Clear</button>
          </div>
        </div>
        <div id="sentence-token-chips" class="token-chips-wrap">
          <span class="token-caret"></span>
        </div>
        <div id="smooth-sentence-text" style="font-size:var(--text-sm); color:var(--text-2); font-style:italic;"></div>
      </div>

      <!-- Fingerspelling Panel Reference Elements -->
      <div id="fingerspelling-panel" style="display:none; margin-top:1rem;">
        <div id="current-live-letter" style="font-size:var(--text-lg); font-weight:700;"></div>
        <div id="spelled-word-display" style="font-size:var(--text-lg);"></div>
        <div id="alphabet-grid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin-top:0.5rem;"></div>
        <button type="button" id="spell-backspace-btn" style="display:none;"></button>
        <button type="button" id="spell-space-btn" style="display:none;"></button>
        <button type="button" id="spell-clear-btn" style="display:none;"></button>
        <button type="button" id="spell-speak-btn" style="display:none;"></button>
        <button type="button" id="spell-send-to-sentence-btn" style="display:none;"></button>
      </div>

    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="transify-bottom-nav" aria-label="Main Navigation">
    <a href="/" class="bottom-nav-item" data-nav="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="/sign" class="bottom-nav-item active" data-nav="sign" aria-current="page">
      <span class="nav-icon">✋</span>
      <span class="nav-label">Sign</span>
    </a>
    <a href="/braille" class="bottom-nav-item" data-nav="braille">
      <span class="nav-icon">⠃</span>
      <span class="nav-label">Braille</span>
    </a>
    <a href="/#voice" class="bottom-nav-item" data-nav="voice">
      <span class="nav-icon">🎙️</span>
      <span class="nav-label">Voice</span>
    </a>
  </nav>

  <!-- Client Application Script -->
  <script src="/static/app.js?v=20261120_redesign_v2"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.SignPage && typeof window.SignPage.init === 'function') {
        window.SignPage.init();
      }
    });
  </script>
</body>
</html>
