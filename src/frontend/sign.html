<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live ASL & HaGRID Hand Gesture Translator — Transify</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body {
      background: var(--paper, #EEEFF5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--font-body, "Hind Siliguri", sans-serif);
      margin: 0;
    }
    .redirect-card {
      text-align: center;
      padding: 32px;
      background: var(--surface, #FFF);
      border-radius: var(--radius-card, 16px);
      box-shadow: var(--shadow-card);
      border: var(--border-width, 1.5px) solid var(--line, #D9DAE6);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h1 style="font-family: var(--font-display, 'Schibsted Grotesk', sans-serif); font-size: 24px; font-weight: 800; margin-bottom: 8px;">Live ASL & HaGRID Hand Gesture Translator</h1>
    <p style="color: var(--text-2, #4A4860); margin-bottom: 16px;">Redirecting to Live Sign Camera...</p>
    <div style="display: none;">
      <video id="sign-video"></video>
      <div id="debounce-progress-fill"></div>
    </div>
    <noscript>
      <p><a href="/#sign" style="color: var(--violet, #8338EC); font-weight: 700;">Open Sign Translator</a></p>
    </noscript>
  </div>
  <script>
    window.location.replace('/#sign');
  </script>
</body>
</html>
