<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transify — Braille Image Translator</title>
  <meta name="description" content="Optical Grade 1 Braille scanner and translator powered by privacy-first machine learning.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/styles.css?v=20261120_redesign_v2">
  <link rel="canonical" href="https://transify.app/braille">
</head>
<body style="background:var(--ink); color:#fff; min-height:100vh; display:flex; flex-direction:column;">

  <!-- Accessible Skip Link -->
  <a href="#braille-main-container" class="skip-link">Skip to translator</a>

  <!-- Polite Live Region -->
  <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Top Navigation Header -->
  <header class="slide-header" style="position:static;">
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <a href="/" class="btn btn-outline-ink" style="min-height:36px; padding:0.25rem 0.75rem; font-size:var(--text-xs); text-decoration:none;" aria-label="Back to Home">← Home</a>
      <h1 class="slide-header-title" style="font-size:var(--text-base);">Braille Image Translator</h1>
    </div>
  </header>

    <!-- Accessible Breadcrumbs -->
  <nav aria-label="Breadcrumb" class="transify-breadcrumbs" style="padding: 8px 16px; font-size: 13px;">
    <ol itemscope itemtype="https://schema.org/BreadcrumbList" style="display:flex; list-style:none; gap:8px; margin:0; padding:0;">
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a itemprop="item" href="/" style="color:var(--violet); text-decoration:none;"><span itemprop="name">Home</span></a>
        <meta itemprop="position" content="1" />
      </li>
      <li aria-hidden="true" style="color:var(--line);">/</li>
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem" aria-current="page">
        <span itemprop="name">Braille OCR</span>
        <meta itemprop="position" content="2" />
      </li>
    </ol>
  </nav>
  <main id="braille-main-container" style="flex:1; max-width:760px; margin:0 auto; width:100%; padding:1rem 1.25rem 6.5rem;">
    
    <!-- Braille Scanner Stage with Real Embossed Photography -->
    <div class="braille-scanner-stage photo-frame" id="braille-preview-wrapper">
      <img src="/static/screen-braille-bg.jpg" class="braille-bg-photo" alt="Embossed Grade 1 Braille page under raking light" width="1000" height="1250">
      <img id="braille-preview-img" style="display:none; position:absolute; inset:0; width:100%; height:100%; object-fit:contain;" alt="Uploaded Braille Preview">
      <div id="braille-scan-beam" class="braille-scan-beam"></div>

      <!-- Dropzone Interactive Target -->
      <div id="braille-dropzone" style="position:absolute; inset:1rem; border:2px dashed var(--signal); border-radius:var(--radius-card); display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(20,17,31,0.65); color:#fff; cursor:pointer;" tabindex="0" role="button" aria-label="Upload Braille Photo">
        <span style="font-size:2.25rem; margin-bottom:0.5rem;" aria-hidden="true">⠃</span>
        <p style="font-weight:700; font-size:var(--text-base); margin-bottom:0.25rem;">Drop Braille image here or tap to upload</p>
        <p style="font-size:var(--text-xs); color:var(--line-2);">Place paper flat. Good raking light helps.</p>
        <input type="file" id="braille-file-input" accept="image/*" style="display:none;">
      </div>
    </div>

    <!-- Actions Row -->
    <div style="display:flex; gap:0.75rem; margin-bottom:1rem; flex-wrap:wrap;">
      <button type="button" id="translate-braille-btn" class="btn btn-signal" style="flex:1; min-width:180px;">Translate Braille</button>
      <button type="button" id="speak-braille-btn" class="btn btn-outline-ink">Speak</button>
      <button type="button" id="copy-braille-btn" class="btn btn-outline-ink">Copy</button>
      <button type="button" id="download-braille-btn" class="btn btn-outline-ink">Save .txt</button>
    </div>

    <!-- Image Quality Advisory Banner -->
    <div id="braille-iqa-banner" style="display:none; padding:0.75rem; border-radius:var(--radius-ctrl); background:var(--surface); color:var(--ink); font-size:var(--text-xs); margin-bottom:0.75rem; border:1.5px solid var(--line);"></div>

    <!-- Cell Coverage Progress Card -->
    <div style="background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-card); padding:1rem; margin-bottom:1rem; color:var(--ink);">
      <div style="display:flex; justify-content:space-between; font-size:var(--text-xs); font-weight:700; margin-bottom:0.4rem;">
        <span>Cell Translation Coverage</span>
        <span id="braille-coverage-label">0 of 0 cells read</span>
      </div>
      <div class="progress-meter-track">
        <div id="braille-coverage-bar" class="progress-meter-fill"></div>
      </div>
    </div>

    <!-- Translated Text Output Container -->
    <div id="braille-text-output" class="braille-result-output" aria-live="polite">
      Translated Braille text will appear here...
    </div>

    <div id="braille-cells-display" style="margin-top:1rem; display:flex; flex-wrap:wrap; gap:8px;"></div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="transify-bottom-nav" aria-label="Main Navigation">
    <a href="/" class="bottom-nav-item" data-nav="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="/sign" class="bottom-nav-item" data-nav="sign">
      <span class="nav-icon">✋</span>
      <span class="nav-label">Sign</span>
    </a>
    <a href="/braille" class="bottom-nav-item active" data-nav="braille" aria-current="page">
      <span class="nav-icon">⠃</span>
      <span class="nav-label">Braille</span>
    </a>
    <a href="/#voice" class="bottom-nav-item" data-nav="voice">
      <span class="nav-icon">🎙️</span>
      <span class="nav-label">Voice</span>
    </a>
  </nav>

  <!-- Client Application Script -->
  <script src="/static/app.js?v=20261120_redesign_v2"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.BraillePage && typeof window.BraillePage.init === 'function') {
        window.BraillePage.init();
      }
    });
  </script>
</body>
</html>
