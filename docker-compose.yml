version: '3.8'

services:
  transify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transify-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database and audio cache between container restarts
      - transify-data:/app/data
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  transify-data:
    driver: local
