name: Transify 2.0 CI/CD Verification

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend, Security, Browser & Android Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for MediaPipe & OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender-dev libgles2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Backend & Browser Regression Test Suite
        env:
          TRANSIFY_ENV: testing
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Android Unit Tests and Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" testDebugUnitTest
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --stacktrace

