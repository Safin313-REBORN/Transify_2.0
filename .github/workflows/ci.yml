name: Transify 2.0 CI/CD Verification

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend, Security, Desktop & Mobile Browser Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for MediaPipe & OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender-dev libgles2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with System Dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: Clean Stale Audit Artifacts and Record Pre-Verification DB Hash
        run: |
          rm -f TRANSIFY_V3_RC1_4_5_DESKTOP_VIEWPORT_MATRIX.json TRANSIFY_V3_RC1_4_5_MOBILE_VIEWPORT_MATRIX.json TRANSIFY_V3_RC1_4_5_SECURITY_HEADER_MATRIX.json TRANSIFY_V3_RC1_4_DESKTOP_VIEWPORT_MATRIX.json
          PRE_HASH=$(sha256sum data/transify.db | awk '{print $1}')
          echo "PRE_VERIFICATION_DB_SHA256=$PRE_HASH" >> $GITHUB_ENV
          echo "Pre-verification data/transify.db SHA-256: $PRE_HASH"

      - name: Run Backend & Browser Regression Test Suite
        id: backend-tests
        env:
          TRANSIFY_ENV: testing
          PYTHONPATH: .
        run: |
          python -m pytest -v --tb=short

      - name: Run Desktop 80-Workspace & Responsive Audit
        id: desktop-audit
        if: always() && steps.backend-tests.outcome != 'cancelled'
        env:
          TRANSIFY_ENV: testing
          PYTHONPATH: .
        run: |
          python scripts/verify_desktop_webview_matrix.py

      - name: Run Mobile 110-Workspace Playwright Audit Matrix
        id: mobile-audit
        if: always() && steps.backend-tests.outcome != 'cancelled'
        env:
          TRANSIFY_ENV: testing
          PYTHONPATH: .
        run: |
          python scripts/verify_mobile_browser_matrix.py

      - name: Generate Fresh Security Header Matrix
        id: security-matrix
        if: always() && steps.backend-tests.outcome != 'cancelled'
        env:
          TRANSIFY_ENV: testing
          PYTHONPATH: .
        run: |
          python scripts/generate_security_matrix.py

      - name: Verify Mandatory Audit Artifacts and Provenance
        run: |
          test -f TRANSIFY_V3_RC1_4_5_DESKTOP_VIEWPORT_MATRIX.json || (echo "ERROR: Missing desktop matrix" && exit 1)
          test -f TRANSIFY_V3_RC1_4_5_MOBILE_VIEWPORT_MATRIX.json || (echo "ERROR: Missing mobile matrix" && exit 1)
          test -f TRANSIFY_V3_RC1_4_5_SECURITY_HEADER_MATRIX.json || (echo "ERROR: Missing security matrix" && exit 1)
          python -c "
          import json, os
          sha = os.environ.get('GITHUB_SHA', '')
          for p in ['TRANSIFY_V3_RC1_4_5_DESKTOP_VIEWPORT_MATRIX.json', 'TRANSIFY_V3_RC1_4_5_MOBILE_VIEWPORT_MATRIX.json', 'TRANSIFY_V3_RC1_4_5_SECURITY_HEADER_MATRIX.json']:
              with open(p) as f:
                  d = json.load(f)
              c = d.get('audit_metadata', {}).get('source_commit')
              print(f'Checking {p}: commit {c}')
              if sha and c != sha:
                  raise ValueError(f'Stale artifact {p} has commit {c} != {sha}')
          "

      - name: Upload Desktop Audit Matrix JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transify-desktop-audit-matrix
          path: TRANSIFY_V3_RC1_4_5_DESKTOP_VIEWPORT_MATRIX.json
          if-no-files-found: error

      - name: Upload Mobile Audit Matrix JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transify-mobile-audit-matrix
          path: TRANSIFY_V3_RC1_4_5_MOBILE_VIEWPORT_MATRIX.json
          if-no-files-found: error

      - name: Upload RC1.4.5 Security Header Matrix JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transify-rc1-4-5-security-matrix
          path: TRANSIFY_V3_RC1_4_5_SECURITY_HEADER_MATRIX.json
          if-no-files-found: error

      - name: Upload Desktop Audit Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transify-desktop-audit-screenshots
          path: TRANSIFY_V3_RC1_4_DESKTOP_SCREENSHOTS/
          if-no-files-found: error

      - name: Upload Mobile Audit Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transify-mobile-audit-screenshots
          path: TRANSIFY_V3_RC1_4_5_SCREENSHOTS/mobile/
          if-no-files-found: error

      - name: Verify Database SHA-256 Invariant and Provenance
        if: always()
        run: |
          POST_HASH=$(sha256sum data/transify.db | awk '{print $1}')
          echo "Pre-verification DB Hash:  $PRE_VERIFICATION_DB_SHA256"
          echo "Post-verification DB Hash: $POST_HASH"
          EXPECTED_HASH="9e5ec945a0450f87705c3702790da675777f7eef3d64e1dfe64221c99e097cac"
          if [ "$POST_HASH" != "$EXPECTED_HASH" ] || [ "$PRE_VERIFICATION_DB_SHA256" != "$POST_HASH" ]; then
            echo "DATABASE INVARIANT BREACH: data/transify.db hash modified during audit/test execution!"
            exit 1
          fi
          echo "DATABASE INVARIANT VERIFIED: data/transify.db remained strictly read-only and unmutated."

      - name: Enforce Overall Verification Gate
        if: always()
        run: |
          echo "Backend Test Outcome: ${{ steps.backend-tests.outcome }}"
          echo "Desktop Audit Outcome: ${{ steps.desktop-audit.outcome }}"
          echo "Mobile Audit Outcome: ${{ steps.mobile-audit.outcome }}"
          echo "Security Matrix Outcome: ${{ steps.security-matrix.outcome }}"
          if [ "${{ steps.backend-tests.outcome }}" != "success" ] || [ "${{ steps.desktop-audit.outcome }}" != "success" ] || [ "${{ steps.mobile-audit.outcome }}" != "success" ] || [ "${{ steps.security-matrix.outcome }}" != "success" ]; then
            echo "CI FAILURE: One or more required test/audit stages failed."
            exit 1
          fi
          echo "ALL AUDIT & TEST GATES PASSED EMPIRICALLY."

