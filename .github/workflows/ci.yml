name: Transify 2.0 CI/CD Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend, Security, Browser & Android Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright

      - name: Install Playwright Chromium with System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Backend & Browser Regression Test Suite
        env:
          TRANSIFY_ENV: testing
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Unit Tests and Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
          ./gradlew assembleDebug --stacktrace
